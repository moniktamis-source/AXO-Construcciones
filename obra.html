<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXO Obra</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#F6F3EC;color:#2E4029;font-family:system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
  a{color:#4A6741}
</style>
</head>
<body>
<!--
  Esta página ya no es la app: la app vive en /obra/.

  Se mudó por un motivo concreto. El manifiesto se armaba en JavaScript y se
  colgaba como blob:, y Chrome no acepta un manifiesto blob para instalar una
  aplicación — por eso el teléfono solo ofrecía "agregar acceso directo".
  Ahora el manifiesto es un archivo real y la app tiene su propia carpeta, así
  su service worker no controla el resto del sitio.

  Este archivo se conserva para que los links viejos que ya compartiste sigan
  funcionando. Manda a /obra/ conservando el cliente y el trabajo, si venían.
-->
<p>Llevándote a la app…<br><br><a id="ir" href="./obra/">Entrar a AXO Obra</a></p>
<script>
(function(){
  // El service worker viejo de la raíz se desinstala solo (ver obra-sw.js).
  // Hay que registrarlo una última vez para que llegue a hacerlo.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('obra-sw.js').catch(function(){});
  }
  var p = new URLSearchParams(location.search);
  var destino = './obra/';
  var q = [];
  ['cliente','trabajo','ir'].forEach(function(k){
    if (p.get(k)) q.push(k + '=' + encodeURIComponent(p.get(k)));
  });
  // Un link viejo apuntaba siempre al Libro de Obra: se respeta esa intención.
  if (!p.get('ir') && (p.get('cliente') || p.get('trabajo'))) q.push('ir=libro');
  if (q.length) destino += '?' + q.join('&');
  document.getElementById('ir').href = destino;
  location.replace(destino);
})();
</script>
</body>
</html>
